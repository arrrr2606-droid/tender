# Настройки мониторинга торгов.
# Ключевые слова, минус-слова и регионы отсюда берутся только при ПЕРВОМ запуске,
# дальше их удобнее менять командами бота (/add, /exclude, /addregion ...).
# Чтобы заново применить этот файл — удалите data/state.json и перезапустите.

interval_minutes: 30          # как часто опрашивать площадки

keywords:
  # Можно просто слово, а можно слово со своими регионами:
  #   - word: погрузчик
  #     regions: [Татарстан, Самарская область]
  - автогрейдер
  - грейдер
  - экскаватор
  - экскаватор-погрузчик
  - погрузчик
  - фронтальный погрузчик
  - спецтехника

# Лот отбрасывается, если в названии есть любое из этих слов.
minus_words:
  - вилочный
  - вилочного
  - складской
  - электропогрузчик
  - штабелер
  - штабелёр
  - ричтрак
  - гидравлическая тележка
  # нужны только закупки техники, а не аренда/услуги/ремонт
  - аренда
  - услуги
  - предоставление
  - ремонт
  - обслуживание

# Регионы для всех ключевых слов. Пусто = вся Россия.
# Понимает: «Татарстан», «Московская область», «МО», «СПб», «ХМАО», код «16», округ «УФО».
regions: []

# true — отсекать лоты, у которых регион определить не удалось.
# false — присылать их с пометкой «регион не определён».
strict_regions: false

# Фильтр по цене (руб.). null — без ограничения. Лоты без цены не отсекаются.
min_price: null
max_price: null

# Не присылать лоты, опубликованные раньше, чем столько дней назад
# (если у лота известен срок подачи заявок — смотрим только на него).
max_age_days: 90

sources:
  eis: true          # ЕИС zakupki.gov.ru — 44-ФЗ и 223-ФЗ
  torgi: false       # torgi.gov.ru — продажа/аренда гос. имущества (не закупки)
  fedresurs: false   # Федресурс — продажа имущества банкротов (не закупки)
  b2b: true          # B2B-Center — коммерческие закупки
  fabrikant: true    # Фабрикант — коммерческие и 223-ФЗ

tls:
  # Госсайты (ЕИС, torgi.gov.ru) используют сертификаты НУЦ Минцифры.
  # В Docker-образе бандл собирается автоматически; локально: python scripts/make_ca_bundle.py
  ca_bundle: certs/ru-bundle.pem
  # Только для локальных проверок, если бандла нет: отключает проверку TLS у госсайтов.
  insecure_gov: false
