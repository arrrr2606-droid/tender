# Проверка площадок по расписанию на серверах GitHub.
# База уже отправленных лотов и настройки из бота хранятся в ветке `state`.
name: Мониторинг торгов

# На бесплатном тарифе GitHub фактически запускает проверку раз в 3–4 часа. ЕИС, torgi.gov.ru,
# Федресурс и Фабрикант не открываются с его зарубежных серверов, поэтому здесь — только B2B-Center.
# Все площадки: свой сервер в России (Docker) или Mac (scripts/install_mac.sh).
# Расписание отключено: мониторинг работает в Yandex Cloud Functions (cloud/index.py).
on:
  workflow_dispatch:            # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write               # чтобы сохранять ветку state

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка
        run: |
          pip install -r requirements.txt
          python scripts/make_ca_bundle.py

      - name: Загрузить базу лотов
        run: |
          mkdir -p data
          if git fetch --depth=1 origin state; then
            git archive FETCH_HEAD | tar -x -C data
            echo "База загружена"
          else
            echo "Ветки state ещё нет — первый запуск"
          fi

      - name: Проверить площадки
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EIS_ELSEWHERE: "1"
        run: python -m monitor.main --once --only b2b

      - name: Сохранить базу лотов
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f data/state.json ] || { echo "Нечего сохранять"; exit 0; }
          D="$RUNNER_TEMP/state"
          rm -rf "$D" && mkdir -p "$D"
          cp data/state.json data/lots.sqlite "$D"/
          cd "$D"
          git init -b state
          git config user.name "tender-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Состояние $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state && exit 0
            echo "Не удалось сохранить, пробую ещё раз через 10 секунд"; sleep 10
          done
          exit 1
