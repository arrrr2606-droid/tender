# Проверка площадок по расписанию на серверах GitHub.
# База уже отправленных лотов и настройки из бота хранятся в ветке `state`.
name: Мониторинг торгов

on:
  schedule:
    - cron: "*/30 * * * *"     # каждые 30 минут (GitHub может задерживать запуск на 5–15 мин)
  workflow_dispatch:            # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write               # чтобы сохранять ветку state

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка
        run: |
          pip install -r requirements.txt
          python scripts/make_ca_bundle.py

      - name: Загрузить базу лотов
        run: |
          mkdir -p data
          if git fetch --depth=1 origin state; then
            git archive FETCH_HEAD | tar -x -C data
            echo "База загружена"
          else
            echo "Ветки state ещё нет — первый запуск"
          fi

      - name: Проверить площадки
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m monitor.main --once

      - name: Сохранить базу лотов
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f data/state.json ] || { echo "Нечего сохранять"; exit 0; }
          cd data
          git init -q -b state
          git config user.name "tender-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Состояние $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state
