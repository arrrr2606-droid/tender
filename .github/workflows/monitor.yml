# Пересылка в Telegram. Торги ищет функция в Yandex Cloud (cloud/index.py) и кладёт их
# в хранилище Яндекса; отсюда (из Telegram недоступен в РФ-облаке) они отправляются в Telegram,
# здесь же обрабатываются кнопки бота. На бесплатном тарифе GitHub запускает это раз в 1–4 часа.
name: Мониторинг торгов

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:            # кнопка «Run workflow» для ручного запуска

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка
        run: pip install -r requirements.txt boto3

      - name: Кнопки бота и отправка найденных торгов
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YC_BUCKET: ${{ secrets.YC_BUCKET }}
          YC_KEY_ID: ${{ secrets.YC_KEY_ID }}
          YC_SECRET: ${{ secrets.YC_SECRET }}
          RELAY_MODE: "1"
        run: python cloud/relay.py
