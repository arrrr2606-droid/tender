# Разовая диагностика: какие площадки открываются с серверов GitHub (ничего не отправляет)
name: Диагностика площадок
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python scripts/make_ca_bundle.py
      - run: python -m monitor.main --dry-run --only eis,b2b,fabrikant,etpgpb,tektorg | grep -E "^===|^!!!" || true
        env: { SOURCE_BUDGET: "60" }
