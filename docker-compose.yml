services:
  monitor:
    build: .
    restart: always
    env_file: .env
    volumes:
      - ./data:/app/data                    # база лотов и настройки из бота
      - ./config.yaml:/app/config.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
